name: Build peripheral
run-name: Build peripheral
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
jobs:
  disk-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check disk before cleanup
        run: |
          echo "=== 清理前磁盘状态 ==="
          df -h
          echo "=== Docker 镜像/层占用 ==="
          docker system df -v || true
          echo "=== 工作目录占用 ==="
          du -sh /home/runner/_work/* || true
          echo "=== Actions 缓存占用 ==="
          du -sh /home/runner/_work/_temp/* /home/runner/_work/_github_home/* 2>/dev/null || true
      
      - name: Find and clean large directories
        run: |
          echo "=== 查找大文件/目录 ==="
          
          # 1. 查看各目录大小
          sudo du -sh /opt/* 2>/dev/null | sort -hr
          sudo du -sh /usr/local/* 2>/dev/null | sort -hr
          sudo du -sh /var/lib/* 2>/dev/null | sort -hr

      - name: Deep Clean Cache & Residue
        run: |
          echo "=== 1. 彻底清理Docker（含镜像层/临时文件） ==="
          docker system prune -af --volumes || true
          rm -rf /var/lib/docker/*  # 直接删Docker根目录（彻底清除镜像层缓存）
          rm -rf /var/lib/docker/tmp/*  # 清理镜像解压临时文件
          
          echo "=== 2. 清理GitHub Actions缓存 ==="
          # 删除Actions内置缓存、临时目录
          rm -rf /home/runner/_work/_temp/*
          rm -rf /home/runner/_work/_github_home/*
          rm -rf /home/runner/_work/_github_workflow/*

          rm -rf /home/runner/_work/*  # 清空所有job的工作目录（无重要数据）
          
          echo "=== 4. 清理系统级大文件（补充） ==="
          # 删预装软件（释放基础空间）
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/*
          # 删APT/临时文件
          apt-get clean
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          
          echo "=== 清理后磁盘状态 ==="
          df -h
          echo "=== 剩余可用空间 ==="
          df -B 1G / | awk 'NR==2 {print $4 " GB"}'
  # 主构建 Job，等待清理完成
  build:
    needs: disk-cleanup  # 关键：等待清理完成
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.11
      options: '--entrypoint /bin/bash'

    steps:
      - name: set_env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" -o "${{ github.event_name }}" = "pull_request_target" ];then
            echo "This is pull request"
            echo "EVENT_TRIGER_REF=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          fi
          if [ "${{ github.event_name }}" = "push" ];then
            echo "This is push"
            echo "EVENT_TRIGER_REF=${{ github.ref }}" >> $GITHUB_ENV
          fi

      - name: print_env
        run: |
          echo "sdk-version -> ${ZSDK_VERSION}"
          echo "event_triger_ref: ${EVENT_TRIGER_REF}"
          echo "${{ github.event.pull_request.head.sha || github.ref }}"

      - name: setup sdk
        shell: bash
        run: |
            echo "zephyr sdk -> zephyr-sdk-${ZSDK_VERSION}"
            ls /opt/toolchains/zephyr-sdk-${ZSDK_VERSION}
            /opt/toolchains/zephyr-sdk-${ZSDK_VERSION}/setup.sh -c

      - name: checkout manifest
        uses: actions/checkout@v4
        with:
          repository: "rtkconnectivity/realtek-zephyr-project.git"
          path: "realtek-zephyr-project"
          ref: "main"
          fetch-depth: 0
          persist-credentials: false

      - name: west update
        shell: bash
        run: |
            cd realtek-zephyr-project
            west init -m https://github.com/rtkconnectivity/realtek-zephyr-project --mr main
            west update
            echo "workspace: $(west topdir)"
            echo "current: $(pwd)"

      - name: check zephyr path and manifest_rev
        shell: bash
        run: |
            echo "GITHUB_REPOSITORY -> $GITHUB_REPOSITORY"
            cd realtek-zephyr-project
            readarray -t project_list <<< "$(west list)"
            EVENT_PROJECT_PATH=""
            for i in "${project_list[@]}"
              do
                  project_detail=($i)
                  project_url=`echo ${project_detail[3]}`
                  repository_name=`echo "$GITHUB_REPOSITORY" | awk -F/ '{print $NF}'`
                  if [[ $project_url == *"${repository_name}" ]]
                  then
                      EVENT_PROJECT_PATH=`echo ${project_detail[1]}`
                      echo "EVENT_PROJECT_PATH=$EVENT_PROJECT_PATH" >> $GITHUB_ENV
                      echo "EVENT_PROJECT_PATH -> $EVENT_PROJECT_PATH"
                      echo "GITHUB_ENV -> $GITHUB_ENV"
                      break
                  fi
              done
              if [ -z "$EVENT_PROJECT_PATH" ]
              then
                  echo "logic error, can not find local path for ${GITHUB_REPOSITY}"
                  exit 1
              fi
              cd $EVENT_PROJECT_PATH
              git log --reverse -1
              echo "need to checkout ${GITHUB_REPOSITORY} in realtek-zephyr-project/$EVENT_PROJECT_PATH"
              echo "manifest_rev=$( git rev-parse manifest-rev )" >> $GITHUB_ENV

      - name: checkout event triggered ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: ${{ format('{0}/{1}','realtek-zephyr-project',env.EVENT_PROJECT_PATH) }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          clean: false

      - name: after check temp module
        shell: bash
        run: |
          cd realtek-zephyr-project/$EVENT_PROJECT_PATH
          echo "manifest_rev -> ${manifest_rev}"
          git branch manifest-rev $manifest_rev

      - name: do build
        shell: bash
        run: |
          cd realtek-zephyr-project/zephyr
          echo "============= build rtl87x2g_evb ============="
          west build -b rtl87x2g_evb samples/bluetooth/peripheral -p
          rm -rf build
          echo "============= build rtl8752h_evb ============="
          west build -b rtl8752h_evb/rtl8752htv samples/bluetooth/peripheral -p
          rm -rf build
