CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_DISK_ACCESS=y

# A full-card erase (CMD38) holds the card busy on DAT0 for far longer than the
# 200 ms default command timeout, so the host reports a response timeout and the
# still-erasing card then poisons every subsequent command. Raise the SD command
# timeout so a whole-card erase can complete within a single CMD38.
CONFIG_SD_CMD_TIMEOUT=30000
