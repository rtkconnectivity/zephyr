CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

CONFIG_PM=n
CONFIG_PM_DEVICE=n

CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_GPIO_LOG_LEVEL_ERR=y
CONFIG_DMA=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_RTC=y
CONFIG_RTC_INIT_PRIORITY=70
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_I2C_BUS_RECOVERY=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_EEPROM_TARGET=y
CONFIG_RTC_ALARM=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
CONFIG_INPUT=y
CONFIG_COUNTER=y
CONFIG_COUNTER_CAPTURE=y

CONFIG_CAN=y
CONFIG_CAN_SHELL=y

# IR RX buffer is allocated from the heap
CONFIG_IR=y

# Internal codec recording, dumped on the shell UART
CONFIG_I2S=y
CONFIG_I2S_BEE_RX=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Move peripheral pins from the shell
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_DEVICE_DEINIT_SUPPORT=y
