#default use ext adv
CONFIG_BT_EXT_ADV=y


CONFIG_PM=y

CONFIG_LOG=y


CONFIG_BT_MESH_CDB=y

CONFIG_BT_MESH_CRPL=30
CONFIG_BT_MESH_MSG_CACHE_SIZE=30

CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=32

CONFIG_BT_MESH_GATT_PROXY_ENABLED=y


CONFIG_BT_MESH_UNPROV_BEACON_INT=10


#other wise will stack overflow
CONFIG_IDLE_STACK_SIZE=1024


#zephyr\subsys\bluetooth\common\Kconfig中配置的值：开启extend adv,值是58，开启leagcy adv,值是255
# CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=5


#长时间运行mesh 使用率有1.3k，leagcy adv发包，使用率是1892byte,default 2600: zephyr\subsys\bluetooth\host\Kconfig ，次数优化ram,配置为2048
CONFIG_BT_RX_STACK_SIZE=2048

#长时间运行之后，使用了1200byte，需要调整2048比较保险
CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=1800

CONFIG_LOG_BUFFER_SIZE=1024

#优化ram:default为32,在zephyr\subsys\bluetooth\mesh\Kconfig
#控制每个Relay节点可同时缓存多少条需要广播出去的retransmit消息，保障高并发场景不丢包，32变为16,减掉1k
CONFIG_BT_MESH_RELAY_BUF_COUNT=8

#zephyr\boards\realtek\rtl8752htv_evb\Kconfig.defconfig中配置的值是7/8，为了优化ram，设置为5和6. config file中配置的acl rx是5，保持一致
CONFIG_BT_BUF_ACL_RX_COUNT=5
CONFIG_BT_BUF_EVT_RX_COUNT=6


#同时支持的中继广告集数量,(默认：0，范围：0 到 BT_EXT_ADV_MAX_ADV_SET），较高的值允许更多并发中继消息。
#若设为 0，缺乏专用中继集，可能限制密集网络中的配网 PDU 中继。

CONFIG_BT_EXT_ADV_MAX_ADV_SET=4
CONFIG_BT_MESH_RELAY_ADV_SETS=2

#允许主adv广播集在专用中继集忙碌时，用于中继消息，（默认：禁用），启用后可提高中继效率，但在主集忙碌时可能延迟本地配网消息
CONFIG_BT_MESH_PB_ADV_USE_RELAY_SETS=y

#为 GATT 服务端广告使用单独的扩展广播集，（默认：禁用）,开启后可减少与 Mesh 广播的竞争
CONFIG_BT_MESH_ADV_EXT_GATT_SEPARATE=y

#为 Friend 节点广告使用单独的扩展广告集,默认：禁用,启用此选项可减少 LPN 扫描时间，间接提高配网效率,优化低功耗节点(LPN)的接收窗口
# BT_MESH_ADV_EXT_FRIEND_SEPARATE=y


#ext adv和scan模式下,scan效率低,需要增加：
#pb-adv的重传:

#Link Open 和 Transaction PDU 的重传次数,（默认：使用中继集时 7，否则 0；范围：0–7）
CONFIG_BT_MESH_PB_ADV_TRANS_PDU_RETRANSMIT_COUNT=4

#Link Ack 和 Transaction Acknowledgment PDU 的重传次数,（默认：2，范围：0–7）,较高值确保确认消息送达，但过多重传可能导致网络拥堵
CONFIG_BT_MESH_PB_ADV_TRANS_ACK_RETRANSMIT_COUNT=3

#Link Close PDU 的重传次数,（默认：使用中继集时 7，否则 2；范围：0–7）
CONFIG_BT_MESH_PB_ADV_LINK_CLOSE_RETRANSMIT_COUNT=4

#配网 PDU 重传的超时时间,较短的超时加快重传，适合噪声环境，但可能增加网络负载；较长的超时可能降低成功率
CONFIG_BT_MESH_PB_ADV_RETRANS_TIMEOUT=350

#configuration的重传：
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=3
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=15

CONFIG_BT_MESH_RELAY_RETRANSMIT_COUNT=3
CONFIG_BT_MESH_RELAY_RETRANSMIT_INTERVAL=15

#本地消息的广告缓冲区数量,默认：6，范围：1–256,缓冲区不足可能导致配网数据包丢失，尤其在密集网络中
CONFIG_BT_MESH_ADV_BUF_COUNT=12



# for debug
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_BT_MESH_PROV_LOG_LEVEL_DBG=y
CONFIG_BT_MESH_TRANS_LOG_LEVEL_DBG=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
