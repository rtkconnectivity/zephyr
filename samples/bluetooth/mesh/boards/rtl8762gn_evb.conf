#RTL_DEBUG[🔧] rtl8762g mesh 开启gpio pwm led
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_LED=y

#RTL_DEBUG[🔧] rtl8762g mesh conf
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

CONFIG_BT_MESH_SETTINGS_WORKQ_STACK_SIZE=2048

CONFIG_BT_EXT_ADV=y
#legacy adv情况下,要设置mesh adv stack,defult值1024不够用
CONFIG_BT_MESH_ADV_STACK_SIZE=2500

CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=255
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=10

CONFIG_IDLE_STACK_SIZE=1024
CONFIG_COUNTER=y

CONFIG_BT_DEVICE_NAME="RTK bee4 Mesh Light"

CONFIG_SHELL=y
CONFIG_BT_MESH_SHELL=y
# CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_CMDS_SELECT=n
# CONFIG_SHELL_HELP=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
# CONFIG_SHELL_STACK_SIZE=1500
# CONFIG_SHELL_CMD_BUFF_SIZE=32
CONFIG_FLASH_SHELL=n


CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y