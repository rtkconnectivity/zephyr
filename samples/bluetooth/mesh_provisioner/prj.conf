CONFIG_SEGGER_SYSVIEW_POST_MORTEM_MODE=n

CONFIG_TRACING_BUFFER_SIZE=4096

CONFIG_TICKLESS_KERNEL=n
CONFIG_TIMESLICE_SIZE=10


#zephyr\subsys\bluetooth\mesh\Kconfig中：
#BT_MESH_PB_ADV_TRANS_PDU_RETRANSMIT_COUNT的defult值为0,BT_MESH_PB_ADV_TRANS_ACK_RETRANSMIT_COUNT为2
#开启extend adv情况下，extend scan效率较legacy scan要低一点，所以要增加重传

#Link Open 和 Transaction PDU 的重传次数,（默认：使用BT_MESH_PB_ADV_USE_RELAY_SETS=y 中继集时 7，否则 0；范围：0–7）
CONFIG_BT_MESH_PB_ADV_TRANS_PDU_RETRANSMIT_COUNT=3

#Link Ack 和 Transaction Acknowledgment PDU 的重传次数,（默认：2，范围：0–7）,较高值确保确认消息送达，但过多重传可能导致网络拥堵
CONFIG_BT_MESH_PB_ADV_TRANS_ACK_RETRANSMIT_COUNT=3

#Link Close PDU 的重传次数,（默认：使用BT_MESH_PB_ADV_USE_RELAY_SETS=y,即中继集时 7，否则 2；范围：0–7）
CONFIG_BT_MESH_PB_ADV_LINK_CLOSE_RETRANSMIT_COUNT=3
#配网 PDU 重传的超时时间,较短的超时加快重传，适合噪声环境，但可能增加网络负载；较长的超时可能降低成功率
CONFIG_BT_MESH_PB_ADV_RETRANS_TIMEOUT=350


#zephyr\subsys\bluetooth\mesh\Kconfig中：
#BT_MESH_NETWORK_TRANSMIT_COUNT的defult值为20,BT_MESH_NETWORK_TRANSMIT_COUNT的defult值为2
#开启extend adv情况下，extend scan效率较legacy scan要低一点，所以要增加重传
CONFIG_BT_MESH_NETWORK_TRANSMIT_INTERVAL=15
CONFIG_BT_MESH_NETWORK_TRANSMIT_COUNT=2

#zephyr\subsys\bluetooth\mesh\Kconfig中：
#BT_MESH_UNPROV_BEACON_INT的defult值为5
#控制未配网节点定期发送未配网 Beacon（Unprovisioned Beacon）包的时间间隔
CONFIG_BT_MESH_UNPROV_BEACON_INT=10

