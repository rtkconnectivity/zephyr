description: Realtek GRTC timer

compatible: "realtek,grtc-timer"

include: base.yaml

properties:
  channel:
    type: int
    required: true
    enum:
      - 0
      - 1
      - 2
      - 3

  reg:
    required: true

  interrupts:
    required: true
