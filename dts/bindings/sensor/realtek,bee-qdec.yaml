description: |
  Bee QDEC

compatible: "realtek,bee-qdec"

include: [sensor-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  x-counts-per-revolution:
    type: int
    default: 4
    description: |
      This is a number that is used to determine how many revolutions
      were done based on the current counter's value.
    enum:
      - 2
      - 4

  y-counts-per-revolution:
    type: int
    default: 4
    description: |
      This is a number that is used to determine how many revolutions
      were done based on the current counter's value.
    enum:
      - 2
      - 4

  z-counts-per-revolution:
    type: int
    default: 4
    description: |
      This is a number that is used to determine how many revolutions
      were done based on the current counter's value.
    enum:
      - 2
      - 4

  x-debounce-time-ms:
    type: int
    default: 4
    description: |
      Set the debounce time of x axis. The unit is ms.

  y-debounce-time-ms:
    type: int
    default: 4
    description: |
      Set the debounce time of x axis. The unit is ms.

  z-debounce-time-ms:
    type: int
    default: 4
    description: |
      Set the debounce time of x axis. The unit is ms.
