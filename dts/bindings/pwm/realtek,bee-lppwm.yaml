description: |
  Realtek Bee always-on low-power PWM (LPPWM).

  The LPPWM lives in the always-on (AON) domain and keeps running
  while the SoC is in a low-power sleep state.

compatible: "realtek,bee-lppwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    type: phandle-array
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
